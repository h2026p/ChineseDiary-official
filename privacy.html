<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Политика конфиденциальности · 中文日记</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, Tahoma, sans-serif;
    background: radial-gradient(circle at 0% 0%, rgba(124,58,237,.10), transparent 40%),
                radial-gradient(circle at 100% 0%, rgba(74,108,247,.12), transparent 40%),
                #eef2ff;
    color: #1e293b;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    background: #fff;
    width: 100%;
    max-width: 800px;
    border-radius: 24px;
    box-shadow: 0 16px 48px rgba(74,108,247,.15);
    overflow: hidden;
    align-self: flex-start;
    padding: 40px;
    border: 1px solid #e2e8f0;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #eef2ff;
  }
  .icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #4a6cf7, #7c3aed);
    color: #fff;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    box-shadow: 0 6px 20px rgba(74,108,247,.3);
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, #4a6cf7, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { font-size: 13px; color: #64748b; margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .content {
    min-height: 400px;
    padding: 20px 0;
    color: #475569;
    line-height: 1.7;
    font-size: 15px;
  }
  .content p { margin-bottom: 16px; }
  .footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 13px;
    color: #64748b;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: linear-gradient(135deg, #4a6cf7, #7c3aed);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    transition: all .2s;
    box-shadow: 0 4px 14px rgba(74,108,247,.3);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(74,108,247,.5);
  }
  @media (max-width: 600px) {
    .container { padding: 24px; }
    .header { flex-direction: column; text-align: center; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">中</div>
      <div>
        <h1>Политика конфиденциальности</h1>
        <div class="subtitle">中文日记 · Китайский Дневник</div>
      </div>
    </div>
    
    <div class="content">
      <!-- Здесь пока пусто, как ты и просил. Можешь вставить свой текст позже. -->
      <p style="color: #94a3b8; font-style: italic;">Текст политики конфиденциальности находится в разработке...</p>
    </div>

    <div class="footer">
      <span>© 2026 中文日记</span>
      <a href="index.html" class="btn">← Вернуться на сайт</a>
    </div>
  </div>
</body>
</html>
